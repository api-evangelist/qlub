name: Qlub
description: >-
  Qlub is a hospitality payments and digital-menu technology company enabling
  contactless pay-at-table, order-and-pay, digital menus, secure payment links, a
  qlub SoftPOS terminal, and the qlub+ rewards program for restaurants, hotels, and
  hospitality venues. Diners scan a QR code to view the bill, split it, add a tip,
  and pay from their own phone without downloading an app or creating an account.
  Qlub operates globally across the UAE, Saudi Arabia, Qatar, Egypt, Jordan,
  Singapore, Malaysia, South Korea, Australia, Brazil, and the United States, and
  integrates with more than one hundred point-of-sale systems. It is backed by Point
  Nine. As of this enrichment pass Qlub publishes no public developer API, OpenAPI
  specification, or self-serve developer portal; technical integrations are delivered
  through direct POS partnerships.
